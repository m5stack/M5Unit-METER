name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'test/**.cpp'
      - 'test/**.hpp'
      - 'test/**.h'
      - 'test/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_*_env.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'test/**.cpp'
      - 'test/**.hpp'
      - 'test/**.h'
      - 'test/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_*_env.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        example:
          - PlotToSerial

        unit:
          - UnitAmeter
          - UnitVmeter
          - UnitKmeterISO
          - UnitDualKmeter
          - UnitINA226_10A

        # Reduced to one board per compile config (ESP32 / S3 / C6 / H2 / P4); the others differ only in the variant header
        board:
          - Core
#          - Core2  # ESP32: represented by Core
          - CoreS3
#          - Fire  # ESP32: represented by Core
#          - StampS3  # ESP32-S3: represented by CoreS3
#          - Dial  # ESP32-S3: represented by CoreS3
#          - Atom  # ESP32: represented by Core
#          - AtomS3  # ESP32-S3: represented by CoreS3
#          - AtomS3R  # ESP32-S3: represented by CoreS3
          - NanoC6
          - NanoH2
#          - StickCPlus  # ESP32: represented by Core
#          - StickCPlus2  # ESP32: represented by Core
#          - StickS3  # ESP32-S3: represented by CoreS3
#          - Paper  # ESP32: represented by Core
#          - CoreInk  # ESP32: represented by Core
#          - Cardputer  # ESP32-S3: represented by CoreS3
          - Tab5
#          - NessoN1  # ESP32-C6: represented by NanoC6

        framework:
          - Arduino

        espressif32:
          - latest
#          - '5_4_0'
#          - '4_4_0'

#        exclude:
#          - board: CoreS3
#            espressif32: '5_4_0'
#          - board: CoreS3
#            espressif32: '4_4_0'
#          - board: StampS3
#            espressif32: '5_4_0'
#          - board: StampS3
#            espressif32: '4_4_0'
#          - board: AtomS3
#            espressif32: '5_4_0'
#          - board: AtomS3
#            espressif32: '4_4_0'
#          - board: Dial
#            espressif32: '5_4_0'
#          - board: Dial
#            espressif32: '4_4_0'
#          - board: NanoC6
#            espressif32: '5_4_0'
#          - board: NanoC6
#            espressif32: '4_4_0'
#          - board: StickCPlus
#            espressif32: '5_4_0'
#          - board: StickCPlus
#            espressif32: '4_4_0'
#          - board: Paper
#            espressif32: '5_4_0'
#          - board: Paper
#            espressif32: '4_4_0'

        include:
          # Specific sketches
          - example: GraphicalMeter
            board: Core
            framework: Arduino
            espressif32: latest
            unit: UnitVmeter
          - example: GraphicalMeter
            board: Core
            framework: Arduino
            espressif32: latest
            unit: UnitAmeter
          - example: GraphicalMeter
            board: Core
            framework: Arduino
            espressif32: latest
            unit: UnitKmeterISO
          - example: GraphicalMeter
            board: Core
            framework: Arduino
            espressif32: latest
            unit: UnitDualKmeter
          - example: PlotToSerial
            board: Core
            framework: Arduino
            espressif32: latest
            unit: UnitINA226_1A
          - example: PlotToSerial
            board: Tab5
            framework: Arduino
            espressif32: latest
            unit: BUILTIN_UNIT_INA226_10A
          - example: ViaPaHub
            board: Core
            framework: Arduino
            espressif32: latest

        exclude:
          - unit: UnitDualKmeter
            board: StampS3
          - unit: UnitDualKmeter
            board: Dial
          - unit: UnitDualKmeter
            board: Atom
          - unit: UnitDualKmeter
            board: AtomS3
          - unit: UnitDualKmeter
            board: AtomS3R
          - unit: UnitDualKmeter
            board: NanoC6
          - unit: UnitDualKmeter
            board: NanoH2
          - unit: UnitDualKmeter
            board: StickCPlus
          - unit: UnitDualKmeter
            board: StickCPlus2
          - unit: UnitDualKmeter
            board: Paper
          - unit: UnitDualKmeter
            board: CoreInk
          - unit: UnitDualKmeter
            board: StickS3
          - unit: UnitDualKmeter
            board: Cardputer
          - unit: UnitDualKmeter
            board: NessoN1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
